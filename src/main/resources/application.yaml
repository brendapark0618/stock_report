server:
  port: 8008

spring:
  application:
    name: stock_report
  datasource:
    url: jdbc:mariadb://100.81.196.103:3379/stock_report_db
    username: root
    password: SqlDba-1
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# --- 여기서부터 추가된 핵심 설정 (Actuator & Prometheus) ---
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus" # 필요한 엔드포인트 노출
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  info:
    env:
      enabled: true

# /info 접속 시 보여줄 데이터
info:
  app:
    name: ${spring.application.name}
    status: running
    id: sk011
