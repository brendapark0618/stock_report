name: springboot-backend-ci-cd
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NAMESPACE: skala-practice
  HARBOR_REGISTRY: amdp-registry.skala-ai.com
  HARBOR_PROJECT: skala26a-ai1
  IMAGE_NAME: skala-stock-api
  # AWS EKS 설정 추가
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: skala-2025

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest

      # [핵심] AWS 자격 증명 설정 (이게 있어야 EKS에 접속 가능합니다)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # [핵심] EKS 접속용 kubeconfig 업데이트
      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to K8s
        run: |
          # 네임스페이스가 없으면 생성 (EKS 환경 안전장치)
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl apply -f mariadb-deploy.yml -n ${{ env.NAMESPACE }}
          kubectl apply -f deployment.yml -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/sk011-stock -n ${{ env.NAMESPACE }}