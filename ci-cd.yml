name: springboot-backend-ci-cd
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  ci-cd:
    name: Build, Push and Deploy to K8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "full_image=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push to Harbor
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest

      # [중요] CD 단계: GitHub이 쿠버네티스 서버에 접속할 수 있도록 인증 설정을 먼저 합니다.
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }} # GitHub Settings에 등록해야 함!

      # [중요] 자동 배포 실행
      - name: Deploy to K8s
        run: |
          # 1. MariaDB 먼저 배포 (순서가 중요해요!)
          kubectl apply -f mariadb-deploy.yml -n skala-practice
          
          # 2. 백엔드 앱 배포
          kubectl apply -f deployment.yml -n skala-practice
          
          # 3. 최신 이미지 즉시 반영을 위한 재시작
          kubectl rollout restart deployment/sk011-stock -n skala-practice
