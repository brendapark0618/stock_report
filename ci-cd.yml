# [삭제] azure/k8s-set-context 단계는 아예 지워버리세요!
      
      # [대체] AWS 인증 후 직접 kubeconfig 생성 (이게 정석입니다)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ap-northeast-2 --name skala-2025

      - name: Deploy to K8s
        run: |
          kubectl apply -f mariadb-deploy.yml -n ${{ env.NAMESPACE }}
          kubectl apply -f deployment.yml -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/sk011-stock -n ${{ env.NAMESPACE }}
